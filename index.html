<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rokunanabox apps</title>
  <style>
    :root { --text: #222; --muted: #666; --bg: #fff; --card: #f4f5f7; --link: #0a7ea4; }
    @media (prefers-color-scheme: dark) { :root { --text: #eee; --muted: #aaa; --bg: #151718; --card: #222527; --link: #6cc4e6; } }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; color: var(--text); background: var(--bg); margin: 0; padding: 24px 16px; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.5rem; }
    .app { background: var(--card); border-radius: 14px; padding: 16px 20px; margin-top: 16px; }
    .app h2 { font-size: 1.15rem; margin: 0; }
    .app p { margin: 4px 0 8px; color: var(--muted); }
    a { color: var(--link); margin-right: 16px; }
  </style>
</head>
<body>
<main>
  <h1>rokunanabox apps</h1>
  <p>rokunanabox が公開しているアプリのサポートページです。</p>

  <section class="app">
    <h2>タスクライン</h2>
    <p>今日のタスクをリストとタイムラインで管理する iPhone 向け ToDo アプリ</p>
    <a href="taskline/support.html">サポート</a>
    <a href="taskline/privacy.html">プライバシーポリシー</a>
  </section>
</main>
</body>
</html>
